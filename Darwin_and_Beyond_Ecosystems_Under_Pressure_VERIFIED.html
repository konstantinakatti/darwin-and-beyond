<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Darwin & Beyond — Ecosystems Under Pressure</title><style>:root{--bg:#0b1721;--panel:#172937;--line:#345161;--ink:#eef7f7;--muted:#bbd0d7;--gold:#ffd47a;--green:#7be0ac}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#08151e,#14313c);color:var(--ink);font:16px system-ui,Arial,sans-serif}header{padding:24px max(18px,calc((100vw - 1200px)/2));background:#102633;border-bottom:2px solid #427166}h1{margin:5px 0;font-size:clamp(26px,4vw,43px)}h2{font-size:21px;margin:0 0 12px}h3{margin:8px 0}p{line-height:1.5}.eyebrow{color:var(--green);font-weight:800;letter-spacing:.1em}.sub{color:var(--muted)}main{max-width:1200px;margin:auto;padding:22px;display:grid;grid-template-columns:1.3fr 1fr;gap:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:18px;box-shadow:0 10px 25px #0002}.wide{grid-column:1/-1}button,select{font:inherit;border-radius:9px;padding:10px 12px}button{cursor:pointer;background:#2b736a;color:white;border:1px solid #68aa9d;font-weight:700}button:hover{filter:brightness(1.18)}button:disabled{opacity:.45;cursor:not-allowed}select{background:#0e222f;color:white;border:1px solid #66828c;max-width:100%}.controls{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.badge{background:#264957;padding:5px 9px;border-radius:20px;color:#e4f6f3}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.hab{border:2px solid #4a6975;border-radius:12px;padding:13px 6px;text-align:center;min-height:110px;background:#213b45}.hab b{display:block;font-size:14px}.hab small{display:block;color:#c6e1e0;margin-top:7px}.hab.active{border-color:var(--gold);background:#425341}.teams{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.team{padding:12px;border:1px solid #54717a;border-radius:12px;background:#102a36}.team.turn{outline:3px solid var(--gold)}.team small{color:var(--muted)}.row{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:7px 0}.bars{display:flex;height:14px;border-radius:8px;overflow:hidden;background:#38505b;margin:9px 0}.bars span:first-child{background:#b98758}.bars span:last-child{background:#e6e4d6}.chart{width:100%;height:200px;background:#0d2330;border-radius:10px}.log{max-height:250px;overflow:auto;padding:0;list-style:none}.log li{border-bottom:1px solid #37515b;padding:8px 0}.hint{padding:11px;background:#274653;border-left:4px solid var(--gold);border-radius:7px}.actions{display:grid;gap:10px}.strategy{border:1px solid #53737d;border-radius:10px;padding:12px;background:#0d2934}.strategy label{display:block;margin:8px 0}.strategy input{accent-color:#60c9ad}.notice{color:var(--gold)}.footer{font-size:13px;color:var(--muted)}@media(max-width:850px){main{display:block}.card{margin:12px 0}.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:500px){.teams{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}} </style></head><body><header><div class="controls" style="justify-content:space-between"><span class="eyebrow">🧬 DARWIN & BEYOND</span><label><span id="langlabel">Language</span> <select id="lang" onchange="render()"><option value="en">English</option><option value="el">Ελληνικά</option></select></label></div><h1 id="title"></h1><div class="sub" id="subtitle"></div></header><main><section class="card wide"><div class="controls" style="justify-content:space-between"><div><b id="status"></b> <span class="badge" id="phase"></span></div><div class="controls"><button id="new" onclick="reset()"></button><button id="next" onclick="advance()"></button></div></div><p class="hint" id="instructions"></p></section><section class="card"><h2 id="maptitle"></h2><div class="grid" id="map"></div><p class="footer" id="mapnote"></p></section><section class="card"><h2 id="poptitle"></h2><div class="teams" id="teams"></div></section><section class="card"><h2 id="choicetitle"></h2><div id="turnbox"></div></section><section class="card"><h2 id="tracktitle"></h2><svg id="chart" class="chart" viewBox="0 0 540 200" role="img" aria-label="Population history"></svg><div id="traitinfo"></div></section><section class="card wide"><h2 id="eventtitle"></h2><p id="event"></p><h2 id="logtitle"></h2><ul class="log" id="log"></ul><p class="footer" id="caveat"></p></section></main><script>
const names=['Forest','Grassland','River','Mountain','Cave'];const icons=['🌲','🌾','🌊','⛰️','🦇'];const elnames=['Δάσος','Λιβάδι','Ποτάμι','Βουνό','Σπηλιά'];const teamspec=[{icon:'🐇',en:'Rabbits',el:'Κουνέλια',kind:'prey',n:30,a:15,b:15,home:0,trait:['Brown fur','White fur'],traitel:['Καφέ τρίχωμα','Λευκό τρίχωμα'],strategy:'camouflage'},{icon:'🦌',en:'Deer',el:'Ελάφια',kind:'prey',n:24,a:12,b:12,home:1,trait:['Fast runners','Steady runners'],traitel:['Γρήγοροι δρομείς','Ανθεκτικοί δρομείς'],strategy:'speed'},{icon:'🐁',en:'Mice',el:'Ποντίκια',kind:'prey',n:35,a:18,b:17,home:0,trait:['Cautious','Bold'],traitel:['Προσεκτικά','Τολμηρά'],strategy:'caution'},{icon:'🐺',en:'Wolves',el:'Λύκοι',kind:'pred',n:9,a:5,b:4,home:0,trait:['Efficient hunters','Endurance hunters'],traitel:['Αποτελεσματικοί κυνηγοί','Ανθεκτικοί κυνηγοί'],strategy:'hunting'}];
const tr={en:{title:'ECOSYSTEMS UNDER PRESSURE',subtitle:'Natural selection × population ecology · 4 populations · 10 generations',lang:'Language',new:'↻ Restart',next:'▶ Next / Resolve generation',map:'Habitats & resources',pop:'Populations',choose:'Population decision',track:'Evolution tracker',events:'Environmental event',history:'Simulation journal',mapnote:'Resources are shared and limited. Populations in the same habitat compete; wolves hunt nearby prey.',caveat:'Educational model, not a prediction of real ecosystems. Traits are inherited in simplified form; no species is inherently “more evolved”.',phase:'Planning',done:'Finished',gen:'Generation',team:'Team',popsize:'Population',resources:'Plants',food:'Food',pred:'Predator',prey:'Prey',habitat:'Habitat',strategy:'Ecological strategy',choice:'Choose habitat',move:'Confirm decision',waiting:'Waiting for this team',ready:'Decision saved',resolve:'All four teams must submit their decisions before resolving the generation.',end:'The simulation is complete. Compare population sizes and inherited-trait frequencies. Explain the changes.',eventnone:'Stable season',summary:'The ecosystem responds to resources, predation, and inherited variation.',trlabel:'Inherited variants',questions:'Discuss: Which trait increased in frequency? Did it help in every habitat? Why did predator and prey numbers change?',opts:['Forage: prioritize food','Hide: reduce predation, less food','Explore: spread out, higher costs'],wolfopts:['Hunt actively: more prey encounters, higher costs','Conserve energy: fewer hunts, lower costs','Track prey: target the most abundant nearby prey'],ev:['Drought: vegetation growth falls.','Harsh winter: survival is harder, especially in the mountains.','Disease outbreak: all populations face additional mortality.','Abundant season: plants recover rapidly.','Wildfire: forest resources decline.','Stable season: no unusual disturbance.'],note:'Each turn represents a generation, not one individual animal. Traits are not chosen by players.',complete:'Final reflection: Is “survival of the strongest” an accurate description of evolution?'},el:{title:'ΟΙΚΟΣΥΣΤΗΜΑΤΑ ΥΠΟ ΠΙΕΣΗ',subtitle:'Φυσική επιλογή × οικολογία πληθυσμών · 4 πληθυσμοί · 10 γενιές',lang:'Γλώσσα',new:'↻ Νέο παιχνίδι',next:'▶ Επόμενο / Υπολογισμός γενιάς',map:'Ενδιαιτήματα & πόροι',pop:'Πληθυσμοί',choose:'Απόφαση πληθυσμού',track:'Παρακολούθηση εξέλιξης',events:'Περιβαλλοντικό γεγονός',history:'Ημερολόγιο προσομοίωσης',mapnote:'Οι πόροι είναι περιορισμένοι και κοινοί. Πληθυσμοί στο ίδιο ενδιαίτημα ανταγωνίζονται· οι λύκοι κυνηγούν κοντινά θηράματα.',caveat:'Απλουστευμένο εκπαιδευτικό μοντέλο, όχι πρόβλεψη πραγματικών οικοσυστημάτων. Τα χαρακτηριστικά κληρονομούνται με απλουστευμένο τρόπο· κανένα είδος δεν είναι «πιο εξελιγμένο».',phase:'Σχεδιασμός',done:'Ολοκληρώθηκε',gen:'Γενιά',team:'Ομάδα',popsize:'Πληθυσμός',resources:'Φυτά',food:'Τροφή',pred:'Θηρευτής',prey:'Θήραμα',habitat:'Ενδιαίτημα',strategy:'Οικολογική στρατηγική',choice:'Επιλογή ενδιαιτήματος',move:'Καταχώριση απόφασης',waiting:'Περιμένουμε απόφαση',ready:'Η απόφαση αποθηκεύτηκε',resolve:'Πρέπει να αποφασίσουν και οι τέσσερις ομάδες πριν υπολογιστεί η γενιά.',end:'Η προσομοίωση ολοκληρώθηκε. Συγκρίνετε μεγέθη πληθυσμών και συχνότητες κληρονομικών χαρακτηριστικών.',eventnone:'Σταθερή εποχή',summary:'Το οικοσύστημα μεταβάλλεται λόγω πόρων, θήρευσης και κληρονομικής ποικιλομορφίας.',trlabel:'Κληρονομικές παραλλαγές',questions:'Συζητήστε: Ποιο χαρακτηριστικό αυξήθηκε; Βοηθούσε σε κάθε περιβάλλον; Γιατί άλλαξαν οι πληθυσμοί θηρευτών και θηραμάτων;',opts:['Αναζήτηση τροφής: περισσότερη τροφή','Απόκρυψη: λιγότερη θήρευση, λιγότερη τροφή','Εξερεύνηση: διασπορά, μεγαλύτερο κόστος'],wolfopts:['Εντατικό κυνήγι: περισσότερες συναντήσεις, μεγαλύτερο κόστος','Εξοικονόμηση: λιγότερα κυνήγια, μικρότερο κόστος','Ιχνηλάτηση: στόχευση άφθονων κοντινών θηραμάτων'],ev:['Ξηρασία: η βλάστηση αναπτύσσεται λιγότερο.','Βαρύς χειμώνας: δυσκολότερη επιβίωση, ειδικά στα βουνά.','Επιδημία: πρόσθετη θνησιμότητα για όλους.','Εποχή αφθονίας: τα φυτά ανακάμπτουν γρήγορα.','Πυρκαγιά: μειώνονται οι πόροι στο δάσος.','Σταθερή εποχή: χωρίς ιδιαίτερη διαταραχή.'],note:'Κάθε γύρος αντιστοιχεί σε μία γενιά, όχι σε ένα ζώο. Οι παίκτες δεν επιλέγουν κληρονομικά χαρακτηριστικά.',complete:'Τελικό ερώτημα: Είναι σωστό να λέμε ότι στην εξέλιξη «επιβιώνει ο ισχυρότερος»;'}};
let s;function reset(){s={g:1,turn:0,teams:teamspec.map(x=>({...x,plan:null})),plants:[100,120,95,55,30],history:[],log:[],event:-1,finished:false};saveHistory();render()};const L=()=>document.getElementById('lang').value;const T=()=>tr[L()];const round=n=>Math.max(0,Math.round(n));const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));const random=(a,b)=>a+Math.random()*(b-a);function saveHistory(){s.history.push(s.teams.map(x=>x.a+x.b))};function choose(){if(s.finished||s.turn>=4)return;const x=s.teams[s.turn];x.plan={hab:+document.getElementById('habchoice').value,mode:+document.querySelector('input[name="mode"]:checked').value};s.turn++;render();document.getElementById("turnbox").scrollIntoView({behavior:"smooth",block:"center"})};function advance(){if(s.finished)return;if(s.turn<4){document.getElementById('instructions').style.borderColor='#f66';document.getElementById('instructions').scrollIntoView({behavior:'smooth',block:'center'});return}simulate();if(s.g>=10){s.finished=true}else{s.g++;s.turn=0;s.teams.forEach(x=>x.plan=null)}render()};function simulate(){const t=T();let event=Math.floor(Math.random()*6);s.event=event;const growth=[24,33,25,12,7];s.plants=s.plants.map((v,i)=>clamp(v+growth[i]*(event===3?1.8:event===0?.35:1)-(event===4&&i===0?55:0),0,[150,170,145,90,70][i]));let foodDemand=[0,0,0,0,0];s.teams.forEach(x=>{x.home=x.plan.hab;if(x.kind==='prey')foodDemand[x.home]+=x.n*(x.plan.mode===0?1.15:x.plan.mode===1?.7:1)});let foodRatio=foodDemand.map((d,i)=>d?Math.min(1,s.plants[i]/d):1);s.plants=s.plants.map((v,i)=>round(Math.max(0,v-foodDemand[i]*foodRatio[i])));const wolves=s.teams[3],w=wolves.plan;let killCount=0;let records=[];s.teams.slice(0,3).forEach((x,idx)=>{let before=x.a+x.b;const h=x.home,mode=x.plan.mode;let hunger=foodRatio[h];let predAccess=Math.abs(h-w.hab)<=1?1:.18;let base=clamp(.76+.19*hunger-(event===1?.09:0)-(event===2?.08:0)-(event===4&&h===0?.07:0)-(mode===2?.05:0),.2,.97);let hunting=predAccess*(w.mode===0?.20:w.mode===1?.09:.15)*(mode===1?.52:mode===2?.87:1)*Math.min(1.4,wolves.n/9);let advantage=idx===0?(h===0?.6:h===3?-.55:.15):idx===1?(h===1?.52:h===3?.25:.15):(h===4?.52:h===0?.3:.1);let sa=clamp(base-hunting*(1-advantage*.48),.02,.98);let sb=clamp(base-hunting*(1+advantage*.48),.02,.98);let aa=round(x.a*sa*random(.94,1.06)),bb=round(x.b*sb*random(.94,1.06));let deaths=before-aa-bb;killCount+=round(Math.max(0,hunting*before*.65));let birth=clamp(.15+.33*hunger-(mode===1?.1:0),.05,.55);x.a=round(aa*(1+birth)*random(.94,1.06));x.b=round(bb*(1+birth)*random(.94,1.06));const cap=[105,120,85,45,35][h];let total=x.a+x.b;if(total>cap){let f=cap/total;x.a=round(x.a*f);x.b=round(x.b*f)}x.n=x.a+x.b;records.push(`${x.icon} ${L()==='el'?x.el:x.en}: ${before} → ${x.n} (${(L()==='el'?x.traitel:x.trait)[0]} ${x.n?round(x.a/x.n*100):0}%)`)});let old=wolves.n;let hunger=clamp(killCount/(Math.max(1,wolves.n)*1.4),0,1);let surv=clamp(.68+.24*hunger-(event===2?.09:0)-(w.mode===0?.06:0),.2,.98);let b=.05+.42*hunger;wolves.a=round(wolves.a*surv*(1+b)*(w.mode===0?1.06:1));wolves.b=round(wolves.b*surv*(1+b)*(w.mode===1?1.05:1));wolves.n=wolves.a+wolves.b;records.push(`${wolves.icon} ${L()==='el'?wolves.el:wolves.en}: ${old} → ${wolves.n}`);s.log.unshift(`${t.gen} ${s.g} — ${t.ev[event]} | ${records.join(' · ')}`);saveHistory()}
function render(){let t=T(),el=L()==='el';const put=(id,v)=>document.getElementById(id).textContent=v;['title','subtitle','lang','new','next','map','pop','choose','track','events','history','mapnote','caveat'].forEach(k=>put(({map:'maptitle',pop:'poptitle',choose:'choicetitle',track:'tracktitle',events:'eventtitle',history:'logtitle',lang:'langlabel'})[k]||k,t[k]));put('status',`${t.gen} ${s.g}/10`);put('phase',s.finished?t.done:t.phase);document.getElementById('next').disabled=s.finished||s.turn<4;document.getElementById('next').style.outline=(!s.finished&&s.turn===4)?'3px solid #ffd47a':'';put('instructions',s.finished?t.end+' '+t.complete:s.turn<4?`${t.team} ${s.turn+1}/4: ${t.note}`:(el?'Όλες οι αποφάσεις καταχωρίστηκαν! Πάτησε «Επόμενο / Υπολογισμός γενιάς» για να συνεχίσεις.':'All decisions saved! Press “Next / Resolve generation” to continue.'));document.getElementById('map').innerHTML=names.map((n,i)=>`<div class="hab"><div style="font-size:30px">${icons[i]}</div><b>${el?elnames[i]:n}</b><small>🌱 ${t.resources}: ${round(s.plants[i])}</small><small>${s.teams.filter(x=>x.home===i).map(x=>x.icon).join(' ')||'—'}</small></div>`).join('');document.getElementById('teams').innerHTML=s.teams.map((x,i)=>`<div class="team ${!s.finished&&s.turn===i?'turn':''}"><div class="row"><b>${x.icon} ${el?x.el:x.en}</b><span class="badge">${x.n}</span></div><small>${x.kind==='prey'?t.prey:t.pred} · ${el?elnames[x.home]:names[x.home]}</small><div class="bars"><span style="width:${x.n?x.a/x.n*100:0}%"></span><span style="flex:1"></span></div><small>${(el?x.traitel:x.trait)[0]}: ${x.a} · ${(el?x.traitel:x.trait)[1]}: ${x.b}</small><div><small>${x.plan?t.ready:t.waiting}</small></div></div>`).join('');let box=document.getElementById('turnbox');if(s.finished){box.innerHTML=`<p>${t.end}</p><p class="hint">${t.questions}</p>`}else if(s.turn>=4){box.innerHTML=`<p class="hint">${el?'Όλες οι ομάδες ολοκλήρωσαν. Πάτησε το κουμπί «Επόμενο / Υπολογισμός γενιάς» στο επάνω μέρος.':'All teams are ready. Click Next / Resolve generation at the top.'}</p><button onclick="advance()">${t.next} ▶</button>`}else{let x=s.teams[s.turn];box.innerHTML=`<h3>${x.icon} ${el?x.el:x.en}</h3><p>${t.strategy}: <b>${x.kind==='pred'?(el?'Κυνήγι και ενεργειακό κόστος':'Hunting and energy cost'):el?'Τροφή, αποφυγή θηρευτών, μετακίνηση':'Food, predator avoidance, movement'}</b></p><label>${t.choice}: <select id="habchoice">${names.map((n,i)=>`<option value="${i}" ${x.home===i?'selected':''}>${icons[i]} ${el?elnames[i]:n}</option>`).join('')}</select></label><div class="strategy">${(x.kind==='pred'?t.wolfopts:t.opts).map((v,i)=>`<label><input type="radio" name="mode" value="${i}" ${i===0?'checked':''}> ${v}</label>`).join('')}</div><p class="footer">${t.note}</p><button onclick="choose()">${t.move} →</button>`}put('event',s.event<0?t.eventnone:t.ev[s.event]);document.getElementById('log').innerHTML=s.log.map(x=>`<li>${x}</li>`).join('')||`<li>${t.summary}</li>`;drawChart();document.getElementById('traitinfo').innerHTML=s.teams.map(x=>`<div class="row"><small>${x.icon} ${(el?x.traitel:x.trait)[0]}</small><b>${x.n?round(100*x.a/x.n):0}%</b></div>`).join('')+`<p class="footer">${t.questions}</p>`}
function drawChart(){let svg=document.getElementById('chart');let max=Math.max(10,...s.history.flat());let colors=['#f7bd76','#b8e2b2','#c5d6f9','#fa929b'];let out='';for(let j=0;j<5;j++){let y=170-j*35;out+=`<line x1="35" y1="${y}" x2="515" y2="${y}" stroke="#385261"/><text x="3" y="${y+4}" fill="#bcd2d9" font-size="11">${round(max*j/4)}</text>`}s.teams.forEach((x,i)=>{let pts=s.history.map((v,j)=>`${35+(j/Math.max(1,10))*475},${170-v[i]/max*140}`).join(' ');out+=`<polyline points="${pts}" fill="none" stroke="${colors[i]}" stroke-width="3"/>`;s.history.forEach((v,j)=>{out+=`<circle cx="${35+(j/10)*475}" cy="${170-v[i]/max*140}" r="4" fill="${colors[i]}"/>`});out+=`<text x="${55+i*125}" y="192" fill="${colors[i]}" font-size="12">${x.icon} ${L()==='el'?x.el:x.en}</text>`});svg.innerHTML=out}
reset();</script></body></html>
